apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-lab
  namespace: argocd
spec:
  project: default

  source:
    repoURL: 'https://github.com/SofiaPasichko/open-data-ai-analytics.git'
    targetRevision: main
    path: gitops/app

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gitops-lab

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true